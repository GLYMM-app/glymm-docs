name: pr-to-dev

on:
  pull_request:
    branches:
      - develop
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  enrich-pr:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Update PR description
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const pr = context.payload.pull_request;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const ticketRegex = /\b[A-Z]{2,10}-\d+\b/g;
            const ticketSet = new Set();
            const collectTickets = (text) => {
              for (const match of (text || '').matchAll(ticketRegex)) ticketSet.add(match[0]);
            };
            collectTickets(pr.title);
            collectTickets(pr.body);
            commits.forEach(commit => collectTickets(commit.commit.message));
            const block = `<!-- codex-pr-summary:start -->\n## Resumen automatico\n- Tickets detectados: ${ticketSet.size ? [...ticketSet].sort().join(", ") : "Sin tickets detectados"}\n- Commits incluidos:\n${commits.map(commit => `- \`${commit.sha.slice(0, 7)}\` ${commit.commit.message.split("\n")[0]}`).join("\n") || "- Sin commits listados"}\n<!-- codex-pr-summary:end -->`;
            const body = pr.body || "";
            const next = /<!-- codex-pr-summary:start -->[\s\S]*<!-- codex-pr-summary:end -->/m.test(body)
              ? body.replace(/<!-- codex-pr-summary:start -->[\s\S]*<!-- codex-pr-summary:end -->/m, block)
              : `${body.trim()}\n\n${block}`.trim();
            if (next !== body) {
              await github.rest.pulls.update({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, body: next });
            }

  validate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Build docs
        run: mkdocs build --strict
