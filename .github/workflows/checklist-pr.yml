name: checklist-pr

on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate checklist
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const unchecked = [...body.matchAll(/^- \[ \] (.+)$/gm)].map(match => match[1].trim());
            const marker = "<!-- checklist-pr:status -->";
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number, per_page: 100 });
            const existing = comments.find(c => c.body.includes(marker));

            if (unchecked.length === 0) {
              if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              return;
            }

            core.warning(`Checklist incompleto: ${unchecked.join(", ")}`);
            const message = `${marker}\n⚠️ **Checklist incompleto** — quedan sin marcar:\n${unchecked.map(item => `- [ ] ${item}`).join("\n")}\n\nEsto es solo informativo, no bloquea el merge.`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: message });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body: message });
            }
